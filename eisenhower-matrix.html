<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Matriz de Eisenhower</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f1f5f9;color:#1e293b;min-height:100vh}
button{cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.__INITIAL_DATA__ = {"matrices":[],"tasks":[]};

(function(){
const {useState,useEffect,useRef,useCallback}=React;
const QCF={
  1:{label:"Hacer",sub:"Importante y Urgente",border:"#f87171",bg:"#fff1f1",badge:"#ef4444"},
  2:{label:"Programar",sub:"Importante pero No Urgente",border:"#60a5fa",bg:"#eff6ff",badge:"#3b82f6"},
  3:{label:"Delegar",sub:"No Importante pero Urgente",border:"#fbbf24",bg:"#fffbeb",badge:"#f59e0b"},
  4:{label:"Eliminar",sub:"No Importante y No Urgente",border:"#94a3b8",bg:"#f8fafc",badge:"#64748b"},
};
function genId(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function isOverdue(t){if(!t.due_date||t.completed)return false;const d=new Date();d.setHours(0,0,0,0);return new Date(t.due_date+"T00:00:00")<d;}
function isDueToday(t){if(!t.due_date||t.completed)return false;const d=new Date();d.setHours(0,0,0,0);const due=new Date(t.due_date+"T00:00:00");return due.getTime()===d.getTime();}
const LS_M="eis_matrices",LS_T="eis_tasks";
function lm(){try{return JSON.parse(localStorage.getItem(LS_M)||"[]");}catch{return[];}}
function lt(){try{return JSON.parse(localStorage.getItem(LS_T)||"[]");}catch{return[];}}
function sm(m){localStorage.setItem(LS_M,JSON.stringify(m));}
function st(t){localStorage.setItem(LS_T,JSON.stringify(t));}

function App(){
  const init=window.__INITIAL_DATA__;
  const [matrices,setMatrices]=useState(()=>{ const d=lm(); return d.length?d:(init&&init.matrices?init.matrices:[]); });
  const [tasks,setTasks]=useState(()=>{ const d=lt(); return d.length?d:(init&&init.tasks?init.tasks:[]); });
  const [selId,setSelId]=useState(null);
  const [showCreate,setShowCreate]=useState(false);
  const [detailTask,setDetailTask]=useState(null);

  useEffect(()=>{sm(matrices);},[matrices]);
  useEffect(()=>{st(tasks);},[tasks]);

  const activeId=selId||matrices[0]?.id;
  const activeMatrix=matrices.find(m=>m.id===activeId);
  const activeTasks=tasks.filter(t=>t.matrix_id===activeId);

  const createMatrix=(data)=>{
    const m={...data,id:genId(),created_date:new Date().toISOString()};
    setMatrices(prev=>[m,...prev]);
    setSelId(m.id);
    setShowCreate(false);
  };
  const deleteMatrix=(id)=>{
    setMatrices(prev=>prev.filter(m=>m.id!==id));
    setTasks(prev=>prev.filter(t=>t.matrix_id!==id));
    if(selId===id)setSelId(null);
  };
  const addTask=(title,quadrant)=>{
    const t={id:genId(),title,quadrant,matrix_id:activeId,completed:false,subtasks:[],notes:"",due_date:"",created_date:new Date().toISOString()};
    setTasks(prev=>[...prev,t]);
  };
  const toggleTask=(task)=>{ setTasks(prev=>prev.map(t=>t.id===task.id?{...t,completed:!t.completed}:t)); if(detailTask?.id===task.id)setDetailTask(prev=>({...prev,completed:!prev.completed})); };
  const deleteTask=(task)=>{ setTasks(prev=>prev.filter(t=>t.id!==task.id)); if(detailTask?.id===task.id)setDetailTask(null); };
  const moveTask=(task,q)=>{ setTasks(prev=>prev.map(t=>t.id===task.id?{...t,quadrant:q}:t)); };
  const updateTask=(id,data)=>{ setTasks(prev=>prev.map(t=>t.id===id?{...t,...data}:t)); setDetailTask(prev=>prev&&prev.id===id?{...prev,...data}:prev); };

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify({matrices,tasks},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="eisenhower-backup.json";a.click();
  };
  const importJSON=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.matrices&&data.tasks){setMatrices(data.matrices);setTasks(data.tasks);setSelId(null);}
        else alert("Archivo JSON no válido");
      }catch{alert("Error al leer el archivo");}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  return React.createElement("div",{style:{display:"flex",height:"100vh",overflow:"hidden"}},
    React.createElement(SidebarE,{matrices,activeId,onSelect:id=>{setSelId(id);},onCreate:()=>setShowCreate(true),onDelete:deleteMatrix,onExport:exportJSON,onImport:importJSON}),
    React.createElement("main",{style:{flex:1,overflowY:"auto",padding:"24px"}},
      matrices.length===0
        ? React.createElement(EmptyStateE,{onCreate:()=>setShowCreate(true)})
        : activeMatrix
          ? React.createElement("div",{style:{maxWidth:1000,margin:"0 auto"}},
              React.createElement(HeaderE,{matrix:activeMatrix,taskCount:activeTasks.filter(t=>!t.completed).length}),
              React.createElement(BoardE,{tasks:activeTasks,onAdd:addTask,onToggle:toggleTask,onDelete:deleteTask,onMove:moveTask,onOpen:t=>{setDetailTask({...t});}}),
            )
          : null
    ),
    showCreate&&React.createElement(CreateDialogE,{onCreate:createMatrix,onClose:()=>setShowCreate(false)}),
    detailTask&&React.createElement(DetailOverlayE,{task:detailTask,onClose:()=>setDetailTask(null),onUpdate:updateTask,onDelete:deleteTask}),
  );
}

// ─── Sidebar ───────────────────────────────────────────────────────────────
function SidebarE({matrices,activeId,onSelect,onCreate,onDelete,onExport,onImport}){
  const fileRef=useRef();
  return React.createElement("aside",{style:{width:220,background:"#fff",borderRight:"1px solid #e2e8f0",display:"flex",flexDirection:"column",padding:"16px 12px",gap:8,flexShrink:0}},
    React.createElement("div",{style:{fontWeight:800,fontSize:15,color:"#6366f1",paddingBottom:12,borderBottom:"1px solid #f1f5f9",marginBottom:4}},"⚡ Eisenhower"),
    React.createElement("button",{onClick:onCreate,style:{background:"#6366f1",color:"#fff",borderRadius:8,padding:"7px 12px",fontWeight:600,fontSize:13,marginBottom:8}},"+ Nueva Matriz"),
    React.createElement("div",{style:{flex:1,overflowY:"auto"}},
      matrices.map(m=>React.createElement("div",{key:m.id,style:{display:"flex",alignItems:"center",gap:6,borderRadius:8,padding:"7px 10px",background:activeId===m.id?"#eef2ff":"transparent",cursor:"pointer",marginBottom:2}},
        React.createElement("span",{onClick:()=>onSelect(m.id),style:{flex:1,fontSize:13,fontWeight:activeId===m.id?700:400,color:activeId===m.id?"#4f46e5":"#334155"}},m.icon+" "+m.name),
        React.createElement("button",{onClick:()=>{ if(confirm("¿Eliminar esta matriz y todas sus tareas?"))onDelete(m.id); },style:{color:"#94a3b8",fontSize:12,padding:2}},"✕"),
      ))
    ),
    React.createElement("div",{style:{borderTop:"1px solid #f1f5f9",paddingTop:12,display:"flex",flexDirection:"column",gap:6}},
      React.createElement("button",{onClick:onExport,style:{background:"#f1f5f9",borderRadius:8,padding:"7px 10px",fontSize:12,fontWeight:600,color:"#475569",textAlign:"left"}},"⬇ Exportar JSON"),
      React.createElement("button",{onClick:()=>fileRef.current.click(),style:{background:"#f1f5f9",borderRadius:8,padding:"7px 10px",fontSize:12,fontWeight:600,color:"#475569",textAlign:"left"}},"⬆ Importar JSON"),
      React.createElement("input",{type:"file",accept:".json",ref:fileRef,style:{display:"none"},onChange:onImport}),
    ),
  );
}

// ─── Header ────────────────────────────────────────────────────────────────
function HeaderE({matrix,taskCount}){
  return React.createElement("div",{style:{marginBottom:24}},
    React.createElement("h1",{style:{fontSize:24,fontWeight:800,display:"flex",alignItems:"center",gap:10}},
      React.createElement("span",{style:{fontSize:28}},matrix.icon||"📋"),matrix.name,
      React.createElement("span",{style:{fontSize:12,background:"#e2e8f0",borderRadius:20,padding:"2px 10px",fontWeight:500,color:"#64748b"}},taskCount+" pendientes"),
    ),
  );
}

// ─── Empty State ───────────────────────────────────────────────────────────
function EmptyStateE({onCreate}){
  return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"80vh"}},
    React.createElement("div",{style:{textAlign:"center"}},
      React.createElement("div",{style:{fontSize:64,marginBottom:16}},"🎯"),
      React.createElement("h2",{style:{fontSize:22,fontWeight:700,marginBottom:8}},"Matriz de Eisenhower"),
      React.createElement("p",{style:{color:"#64748b",marginBottom:24}},"Organiza tus tareas según importancia y urgencia."),
      React.createElement("button",{onClick:onCreate,style:{background:"#6366f1",color:"#fff",borderRadius:10,padding:"12px 28px",fontWeight:700,fontSize:15}},"+ Crear primera matriz"),
    ),
  );
}

// ─── Board ─────────────────────────────────────────────────────────────────
function BoardE({tasks,onAdd,onToggle,onDelete,onMove,onOpen}){
  return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
    [1,2,3,4].map(q=>React.createElement(QuadrantE,{key:q,quadrant:q,tasks:tasks.filter(t=>t.quadrant===q),onAdd:title=>onAdd(title,q),onToggle,onDelete,onMove,onOpen})),
  );
}

// ─── Quadrant ──────────────────────────────────────────────────────────────
function QuadrantE({quadrant,tasks,onAdd,onToggle,onDelete,onMove,onOpen}){
  const [input,setInput]=useState("");
  const [showInput,setShowInput]=useState(false);
  const cfg=QCF[quadrant];
  const pending=tasks.filter(t=>!t.completed);
  const done=tasks.filter(t=>t.completed);
  const submit=(e)=>{e.preventDefault();if(input.trim()){onAdd(input.trim());setInput("");setShowInput(false);}};
  return React.createElement("div",{style:{borderRadius:16,border:"2px solid "+cfg.border,background:cfg.bg,display:"flex",flexDirection:"column",overflow:"hidden"}},
    React.createElement("div",{style:{padding:"14px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid "+cfg.border+"55"}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
        React.createElement("span",{style:{background:cfg.badge,color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700}},"Q"+quadrant),
        React.createElement("div",null,
          React.createElement("div",{style:{fontWeight:700,fontSize:13}}),
          React.createElement("div",{style:{fontSize:11,color:"#64748b"}},cfg.sub),
        ),
        React.createElement("span",{style:{fontWeight:700,fontSize:14}},cfg.label),
      ),
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6}},
        React.createElement("span",{style:{fontSize:12,color:"#64748b"}},pending.length),
        React.createElement("button",{onClick:()=>setShowInput(true),style:{background:cfg.border,borderRadius:"50%",width:24,height:24,color:"#fff",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}},"＋"),
      ),
    ),
    React.createElement("div",{style:{flex:1,padding:"10px 12px",maxHeight:300,overflowY:"auto"}},
      showInput&&React.createElement("form",{onSubmit:submit,style:{marginBottom:8}},
        React.createElement("div",{style:{display:"flex",gap:6,background:"#fff",borderRadius:10,padding:"6px 10px",border:"1px solid #e2e8f0"}},
          React.createElement("input",{autoFocus:true,value:input,onChange:e=>setInput(e.target.value),onBlur:()=>{if(!input.trim())setShowInput(false);},placeholder:"Nueva tarea...",style:{flex:1,border:"none",outline:"none",fontSize:13}}),
          React.createElement("button",{type:"submit",style:{color:cfg.badge,fontWeight:700,fontSize:18}},"＋"),
        ),
      ),
      pending.map(t=>React.createElement(TaskItemE,{key:t.id,task:t,quadrant,onToggle,onDelete,onMove,onOpen})),
      done.length>0&&React.createElement("div",{style:{paddingTop:8,marginTop:4,borderTop:"1px solid #e2e8f055"}},
        React.createElement("div",{style:{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1,marginBottom:4}},"Completadas ("+done.length+")"),
        done.map(t=>React.createElement(TaskItemE,{key:t.id,task:t,quadrant,onToggle,onDelete,onMove,onOpen})),
      ),
      tasks.length===0&&!showInput&&React.createElement("button",{onClick:()=>setShowInput(true),style:{width:"100%",padding:"20px 0",color:"#94a3b8",fontSize:13}},"+ Añadir tarea"),
    ),
  );
}

// ─── TaskItem ──────────────────────────────────────────────────────────────
function TaskItemE({task,quadrant,onToggle,onDelete,onMove,onOpen}){
  const [hover,setHover]=useState(false);
  const overdue=isOverdue(task);
  const dueToday=isDueToday(task);
  const bg=task.completed?"transparent":overdue?"#fff1f1":dueToday?"#fff7ed":"#fff";
  const border=task.completed?"none":overdue?"1px solid #fca5a5":dueToday?"1px solid #fdba74":"1px solid #f1f5f9";
  const subtaskCount=task.subtasks?.length||0;
  const doneCount=task.subtasks?.filter(s=>s.done).length||0;
  return React.createElement("div",{
    onMouseEnter:()=>setHover(true),
    onMouseLeave:()=>setHover(false),
    style:{borderRadius:10,background:bg,border,marginBottom:4,opacity:task.completed?0.55:1,transition:"all .15s"},
  },
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,padding:"8px 10px"}},
      React.createElement("button",{
        onClick:()=>onToggle(task),
        style:{width:16,height:16,borderRadius:"50%",border:task.completed?"none":"2px solid #94a3b8",background:task.completed?"#6366f1":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:10,transition:"all .15s"},
      },task.completed?"✓":""),
      React.createElement("button",{
        onClick:()=>onOpen(task),
        style:{flex:1,textAlign:"left",fontSize:13,textDecoration:task.completed?"line-through":"none",color:task.completed?"#94a3b8":overdue?"#dc2626":"#1e293b",fontWeight:overdue&&!task.completed?600:400},
      },task.title),
      (overdue||dueToday)&&!task.completed&&React.createElement("span",{title:overdue?"Fecha vencida":"Vence hoy",style:{fontSize:14}},overdue?"🔴":"🟠"),
      hover&&!task.completed&&React.createElement("div",{style:{display:"flex",gap:2}},
        [1,2,3,4].filter(q=>q!==quadrant).map(q=>React.createElement("button",{key:q,onClick:()=>onMove(task,q),title:"Mover a Q"+q,style:{width:18,height:18,borderRadius:4,fontSize:9,fontWeight:700,background:q===1?"#fecaca":q===2?"#bfdbfe":q===3?"#fde68a":"#e2e8f0",color:q===1?"#dc2626":q===2?"#2563eb":q===3?"#d97706":"#64748b"}},q)),
        React.createElement("button",{onClick:()=>onDelete(task),style:{color:"#ef4444",fontSize:14,padding:"0 2px"}},"🗑"),
      ),
    ),
    subtaskCount>0&&React.createElement("div",{style:{padding:"0 10px 8px",display:"flex",alignItems:"center",gap:8}},
      React.createElement("div",{style:{flex:1,height:4,background:"#f1f5f9",borderRadius:2,overflow:"hidden"}},
        React.createElement("div",{style:{width:(doneCount/subtaskCount*100)+"%",height:"100%",background:"#6366f1",borderRadius:2}}),
      ),
      React.createElement("span",{style:{fontSize:10,color:"#94a3b8"}},doneCount+"/"+subtaskCount),
    ),
  );
}

// ─── Create Dialog ─────────────────────────────────────────────────────────
const EMOJIS=["💼","🏠","👨‍👩‍👧‍👦","🎯","📚","💪","🚀","🎨","💡","🌟","🧠","❤️"];
function CreateDialogE({onCreate,onClose}){
  const [name,setName]=useState("");
  const [icon,setIcon]=useState("💼");
  const submit=(e)=>{e.preventDefault();if(!name.trim())return;onCreate({name:name.trim(),icon});};
  return React.createElement("div",{onClick:e=>{if(e.target===e.currentTarget)onClose();},style:{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}},
    React.createElement("div",{style:{background:"#fff",borderRadius:16,padding:28,width:380,boxShadow:"0 20px 60px rgba(0,0,0,.2)"}},
      React.createElement("h2",{style:{fontSize:18,fontWeight:700,marginBottom:20}},"Nueva Matriz"),
      React.createElement("form",{onSubmit:submit},
        React.createElement("label",{style:{display:"block",fontSize:13,fontWeight:600,marginBottom:6}},"Nombre"),
        React.createElement("input",{autoFocus:true,value:name,onChange:e=>setName(e.target.value),placeholder:"Ej: Trabajo, Personal...",style:{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 12px",fontSize:14,marginBottom:16,outline:"none"}}),
        React.createElement("label",{style:{display:"block",fontSize:13,fontWeight:600,marginBottom:8}},"Icono"),
        React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:8,marginBottom:24}},
          EMOJIS.map(e=>React.createElement("button",{key:e,type:"button",onClick:()=>setIcon(e),style:{width:40,height:40,borderRadius:10,fontSize:20,border:icon===e?"2px solid #6366f1":"2px solid transparent",background:icon===e?"#eef2ff":"#f8fafc"}},e)),
        ),
        React.createElement("div",{style:{display:"flex",gap:10,justifyContent:"flex-end"}},
          React.createElement("button",{type:"button",onClick:onClose,style:{padding:"8px 18px",borderRadius:8,border:"1px solid #e2e8f0",fontSize:14}},"Cancelar"),
          React.createElement("button",{type:"submit",disabled:!name.trim(),style:{padding:"8px 18px",borderRadius:8,background:"#6366f1",color:"#fff",fontWeight:600,fontSize:14,opacity:name.trim()?1:.5}},"Crear"),
        ),
      ),
    ),
  );
}

// ─── Detail Overlay ────────────────────────────────────────────────────────
function DetailOverlayE({task,onClose,onUpdate,onDelete}){
  const [title,setTitle]=useState(task.title);
  const [notes,setNotes]=useState(task.notes||"");
  const [subtasks,setSubtasks]=useState(task.subtasks||[]);
  const [dueDate,setDueDate]=useState(task.due_date||"");
  const [newSub,setNewSub]=useState("");
  const [tab,setTab]=useState("notes");
  const saveRef=useRef(null);

  const save=useCallback((t,n,s,d)=>{
    clearTimeout(saveRef.current);
    saveRef.current=setTimeout(()=>onUpdate(task.id,{title:t,notes:n,subtasks:s,due_date:d}),700);
  },[task.id,onUpdate]);

  const setT=(v)=>{setTitle(v);save(v,notes,subtasks,dueDate);};
  const setN=(v)=>{setNotes(v);save(title,v,subtasks,dueDate);};
  const setD=(v)=>{setDueDate(v);save(title,notes,subtasks,v);};
  const setSubs=(v)=>{setSubtasks(v);save(title,notes,v,dueDate);};

  const addSub=(e)=>{e.preventDefault();if(!newSub.trim())return;setSubs([...subtasks,{id:genId(),text:newSub.trim(),done:false}]);setNewSub("");};
  const toggleSub=(id)=>setSubs(subtasks.map(s=>s.id===id?{...s,done:!s.done}:s));
  const delSub=(id)=>setSubs(subtasks.filter(s=>s.id!==id));

  const overdue=dueDate&&!task.completed&&(new Date(dueDate+"T00:00:00")<new Date(new Date().setHours(0,0,0,0)));
  const dToday=dueDate&&!task.completed&&(new Date(dueDate+"T00:00:00").getTime()===new Date(new Date().setHours(0,0,0,0)).getTime());
  const comp=subtasks.filter(s=>s.done).length;

  return React.createElement("div",{onClick:e=>{if(e.target===e.currentTarget)onClose();},style:{position:"fixed",inset:0,background:"rgba(0,0,0,.25)",zIndex:200}},
    React.createElement("div",{style:{position:"absolute",top:0,right:0,height:"100%",width:"min(480px,100%)",background:"#fff",boxShadow:"-8px 0 40px rgba(0,0,0,.15)",display:"flex",flexDirection:"column"}},
      // Header
      React.createElement("div",{style:{padding:"20px 20px 14px",borderBottom:"1px solid #f1f5f9"}},
        React.createElement("div",{style:{display:"flex",alignItems:"flex-start",gap:10,marginBottom:10}},
          React.createElement("input",{value:title,onChange:e=>setT(e.target.value),style:{flex:1,fontSize:17,fontWeight:700,border:"none",outline:"none",padding:0,background:"transparent"}}),
          React.createElement("button",{onClick:onClose,style:{color:"#94a3b8",fontSize:20,lineHeight:1}},"✕"),
        ),
      ),
      // Due date
      React.createElement("div",{style:{padding:"10px 20px",borderBottom:"1px solid #f1f5f9",display:"flex",alignItems:"center",gap:8,background:overdue?"#fff1f1":dToday?"#fff7ed":"transparent"}},
        React.createElement("span",null,"📅"),
        React.createElement("input",{type:"date",value:dueDate,onChange:e=>setD(e.target.value),style:{border:"none",outline:"none",fontSize:13,background:"transparent",color:overdue?"#dc2626":dToday?"#ea580c":"#64748b",fontWeight:overdue||dToday?600:400,cursor:"pointer"}}),
        !dueDate&&React.createElement("span",{style:{fontSize:13,color:"#94a3b8"}},"Sin fecha límite"),
        overdue&&React.createElement("span",{style:{fontSize:11,fontWeight:700,color:"#dc2626",background:"#fee2e2",borderRadius:20,padding:"2px 8px"}},"¡Fecha vencida!"),
        dToday&&React.createElement("span",{style:{fontSize:11,fontWeight:700,color:"#ea580c",background:"#ffedd5",borderRadius:20,padding:"2px 8px"}},"Vence hoy"),
      ),
      // Tabs
      React.createElement("div",{style:{display:"flex",borderBottom:"1px solid #f1f5f9",padding:"0 20px"}},
        ["notes","subtasks"].map(t=>React.createElement("button",{key:t,onClick:()=>setTab(t),style:{padding:"10px 8px",fontSize:13,fontWeight:600,borderBottom:tab===t?"2px solid #6366f1":"2px solid transparent",color:tab===t?"#6366f1":"#94a3b8",marginRight:8,marginBottom:-1}},t==="notes"?"📝 Notas":"✅ Subtareas"+(subtasks.length?" ("+comp+"/"+subtasks.length+")":""))),
      ),
      // Content
      React.createElement("div",{style:{flex:1,overflow:"auto"}},
        tab==="notes"
          ? React.createElement("textarea",{value:notes,onChange:e=>setN(e.target.value),placeholder:"Añade notas, contexto...",style:{width:"100%",height:"100%",border:"none",outline:"none",padding:"16px 20px",fontSize:13,resize:"none",lineHeight:1.7,fontFamily:"inherit"}})
          : React.createElement("div",{style:{padding:"16px 20px"}},
              subtasks.length>0&&React.createElement("div",{style:{marginBottom:16}},
                React.createElement("div",{style:{height:6,background:"#f1f5f9",borderRadius:3,overflow:"hidden"}},
                  React.createElement("div",{style:{width:(comp/subtasks.length*100)+"%",height:"100%",background:"#6366f1",borderRadius:3}}),
                ),
                React.createElement("div",{style:{fontSize:11,color:"#94a3b8",marginTop:4}},comp+" de "+subtasks.length+" completadas"),
              ),
              React.createElement("form",{onSubmit:addSub,style:{display:"flex",gap:8,marginBottom:12}},
                React.createElement("input",{value:newSub,onChange:e=>setNewSub(e.target.value),placeholder:"Añadir subtarea...",style:{flex:1,border:"1px solid #e2e8f0",borderRadius:8,padding:"7px 10px",fontSize:13,outline:"none"}}),
                React.createElement("button",{type:"submit",style:{background:"#6366f1",color:"#fff",borderRadius:8,padding:"7px 12px",fontSize:13,fontWeight:600}},"+"),
              ),
              subtasks.filter(s=>!s.done).map(s=>React.createElement(SubItemE,{key:s.id,sub:s,onToggle:()=>toggleSub(s.id),onDelete:()=>delSub(s.id)})),
              subtasks.filter(s=>s.done).length>0&&React.createElement("div",{style:{marginTop:12,paddingTop:12,borderTop:"1px solid #f1f5f9"}},
                React.createElement("div",{style:{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1,marginBottom:6}},"Completadas"),
                subtasks.filter(s=>s.done).map(s=>React.createElement(SubItemE,{key:s.id,sub:s,onToggle:()=>toggleSub(s.id),onDelete:()=>delSub(s.id)})),
              ),
            ),
      ),
      // Footer
      React.createElement("div",{style:{padding:"12px 20px",borderTop:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        React.createElement("button",{onClick:()=>{onDelete(task);},style:{fontSize:13,color:"#ef4444",display:"flex",alignItems:"center",gap:4}},"🗑 Eliminar tarea"),
        React.createElement("button",{onClick:onClose,style:{border:"1px solid #e2e8f0",borderRadius:8,padding:"7px 16px",fontSize:13,fontWeight:600}},"Cerrar"),
      ),
    ),
  );
}

function SubItemE({sub,onToggle,onDelete}){
  const [h,setH]=useState(false);
  return React.createElement("div",{
    onMouseEnter:()=>setH(true),onMouseLeave:()=>setH(false),
    style:{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:10,background:sub.done?"transparent":"#f8fafc",marginBottom:4,opacity:sub.done?.55:1},
  },
    React.createElement("button",{onClick:onToggle,style:{width:16,height:16,borderRadius:"50%",border:sub.done?"none":"2px solid #94a3b8",background:sub.done?"#6366f1":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:10}},sub.done?"✓":""),
    React.createElement("span",{style:{flex:1,fontSize:13,textDecoration:sub.done?"line-through":"none",color:sub.done?"#94a3b8":"#1e293b"}},sub.text),
    h&&React.createElement("button",{onClick:onDelete,style:{color:"#94a3b8",fontSize:14}},"✕"),
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
})();

</script>
</body>
</html>
